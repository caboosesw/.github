name: Audit finding
description: A standards or code-review finding mapped to an AGENTS.md rule.
title: ""
body:
  - type: textarea
    id: cto_summary
    attributes:
      label: CTO summary
      description: 1-3 plain sentences. The gap, the risk, and the fix in outcome terms.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: "`path:line` references showing the gap."
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: Rule
      description: The AGENTS.md rule and severity (P0-P3) it maps to, plus its Safe path.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and out of scope
  - type: textarea
    id: verify
    attributes:
      label: How to verify
  - type: dropdown
    id: risk
    attributes:
      label: Risk class
      options:
        - Routine
        - Needs owner decision
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options:
        - S
        - M
        - L
